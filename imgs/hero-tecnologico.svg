  <g filter="url(#energy-glow)">
    <path class="energy-line" pathLength="100" d="M690 0v92h104l48 48h116v54h93l42 42h74"/>
    <path class="energy-line" pathLength="100" d="M841 0v57h88l64 64v54h92l48 48"/>
