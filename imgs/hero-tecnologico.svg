    <path class="energy-line" pathLength="100" d="M0 506h782l66-66h141l54-54"/>
  </g>

  <g fill="#46E6F3">
    <circle cx="690" cy="92" r="4"/><circle cx="946" cy="175" r="4"/>
    <circle cx="1160" cy="86" r="4"/><circle cx="1330" cy="108" r="4"/>
