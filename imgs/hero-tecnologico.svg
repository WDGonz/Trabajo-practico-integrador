<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="650" viewBox="0 0 1920 650" fill="none">
  <defs>
    <linearGradient id="background" x1="120" y1="70" x2="1830" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17465C"/>
      <stop offset=".52" stop-color="#0F6074"/>
      <stop offset="1" stop-color="#18375E"/>
    </linearGradient>
    <linearGradient id="circuit" x1="540" y1="0" x2="1660" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14D6D1" stop-opacity=".08"/>
      <stop offset=".56" stop-color="#20D9F2" stop-opacity=".75"/>
      <stop offset="1" stop-color="#668CFF" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="matrix(0 240 -240 0 1410 323)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#31E9E3" stop-opacity=".3"/>
      <stop offset=".44" stop-color="#11BFE0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#1673D5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="1230" y1="205" x2="1580" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C5268"/>
      <stop offset="1" stop-color="#102B50"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#54D5E5" stroke-opacity=".07"/>
      <circle cx="1" cy="1" r="1.5" fill="#54D5E5" fill-opacity=".2"/>
    </pattern>
    <filter id="glow" x="1020" y="0" width="800" height="650" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="energy-glow" x="0" y="0" width="1920" height="650" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .energy-line {
      stroke: #9CFAFF;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 14 86;
      stroke-dashoffset: 14;
      animation: energy-flow 3.2s linear infinite;
    }

    .energy-line:nth-child(2n) {
      stroke: #4DF3FF;
      animation-duration: 2.7s;
    }

    .energy-line:nth-child(3n) {
      stroke: #C2FFFF;
      stroke-dasharray: 10 90;
      stroke-dashoffset: 10;
      animation-duration: 3.8s;
    }

    .energy-line:nth-child(1)  { animation-delay: -0.4s; }
    .energy-line:nth-child(2)  { animation-delay: -1.9s; }
    .energy-line:nth-child(3)  { animation-delay: -0.9s; }
    .energy-line:nth-child(4)  { animation-delay: -2.6s; }
    .energy-line:nth-child(5)  { animation-delay: -1.2s; }
    .energy-line:nth-child(6)  { animation-delay: -2.1s; }
    .energy-line:nth-child(7)  { animation-delay: -0.2s; }
    .energy-line:nth-child(8)  { animation-delay: -1.5s; }
    .energy-line:nth-child(9)  { animation-delay: -2.9s; }
    .energy-line:nth-child(10) { animation-delay: -0.7s; }
    .energy-line:nth-child(11) { animation-delay: -2.3s; }
    .energy-line:nth-child(12) { animation-delay: -1.1s; }
    .energy-line:nth-child(13) { animation-delay: -3.1s; }
    .energy-line:nth-child(14) { animation-delay: -0.6s; }
    .energy-line:nth-child(15) { animation-delay: -1.7s; }
    .energy-line:nth-child(16) { animation-delay: -2.5s; }
    .energy-line:nth-child(17) { animation-delay: -0.3s; }
    .energy-line:nth-child(18) { animation-delay: -1.4s; }
    .energy-line:nth-child(19) { animation-delay: -2.8s; }
    .energy-line:nth-child(20) { animation-delay: -1.0s; }

    .core-pulse {
      transform-origin: 1410px 323px;
      animation: core-breathe 3.4s ease-in-out infinite alternate;
    }

    .ring-cw {
      transform-origin: 1410px 323px;
      animation: spin-cw 32s linear infinite;
    }

    .ring-ccw {
      transform-origin: 1410px 323px;
      animation: spin-ccw 44s linear infinite;
    }

    .chip-aura {
      animation: aura-pulse 2.8s ease-in-out infinite alternate;
    }

    .chip-led {
      animation: led-pulse 1.8s ease-in-out infinite alternate;
    }

    .chip-led--delayed {
      animation-delay: -0.9s;
    }

    @keyframes energy-flow {
      0% {
        stroke-dashoffset: 14;
        opacity: 0;
      }
      10% {
        opacity: 0.95;
      }
      82% {
        opacity: 0.95;
      }
      96%, 100% {
        stroke-dashoffset: -100;
        opacity: 0;
      }
    }

    @keyframes core-breathe {
      from {
        transform: scale(0.96);
        opacity: 0.78;
      }
      to {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes spin-ccw {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }

    @keyframes aura-pulse {
      from { fill-opacity: 0.12; }
      to   { fill-opacity: 0.28; }
    }

    @keyframes led-pulse {
      from { opacity: 0.45; }
      to   { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .energy-line,
      .core-pulse,
      .ring-cw,
      .ring-ccw,
      .chip-aura,
      .chip-led {
        animation: none;
      }
      .energy-line {
        opacity: 0;
      }
    }
  </style>
  <path fill="url(#background)" d="M0 0h1920v650H0z"/>
  <path fill="url(#grid)" d="M0 0h1920v650H0z"/>
  <ellipse class="core-pulse" cx="1410" cy="323" fill="#14C8E8" fill-opacity=".2" filter="url(#glow)" rx="210" ry="180"/>
  <circle class="core-pulse" cx="1410" cy="323" r="240" fill="url(#core)"/>

  <g stroke="url(#circuit)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
